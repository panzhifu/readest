[package]
name = "tauri-plugin-sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Lightweight SQLite plugin for Tauri (rusqlite-based)"
links = "tauri-plugin-sqlite"
exclude = ["/examples", "/guest-js", "/node_modules"]

[lib]
crate-type = ["lib"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
