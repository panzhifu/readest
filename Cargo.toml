[workspace]
resolver = "2"
members = [
  "apps/readest-app/src-tauri",
  "packages/tauri-plugins/plugins/fs",
  "packages/tauri/crates/tauri"
]
exclude = ["packages/qcms"]

[workspace.package]
authors = ["Bilingify LLC"]
edition = "2021"
rust-version = "1.77.2"
homepage = "https://readest.com"
repository = "https://github.com/readest/readest"
license = "AGPL-3.0"
categories = []

[workspace.dependencies]
dunce = "1"
glib = "0.20.0"
glob = "0.3"
log = "0.4"
nix = "0.20.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.45"
tauri = { version = "2", default-features = false }
tauri-build = "2"
tauri-plugin = "2"
tauri-utils = "2"
thiserror = "2"
tracing = "0.1"
url = "2"
zbus = "5.9"

[patch.crates-io]
tauri = { path = "packages/tauri/crates/tauri" }
tauri-plugin-fs = { path = "packages/tauri-plugins/plugins/fs" }

[profile.release]
strip = true
lto = true
panic = "abort"
incremental = false
codegen-units = 1
